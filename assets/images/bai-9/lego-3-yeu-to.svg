<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%">
  <defs>
    <filter id="neo-shadow-4" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="soft-shadow-4" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="10" y="10" width="520" height="240" rx="18" fill="#fefce8" stroke="#293140" stroke-width="3" filter="url(#neo-shadow-4)"/>

  <!-- Left: 3 Interlocking Cartoon Puzzle Blocks -->
  <g transform="translate(25, 30)">
    <!-- BLOCK 1: NHIỆM VỤ (Yellow) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="110" height="180" rx="12" fill="#fed7aa" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-4)"/>
      <!-- Puzzle Nub Right -->
      <circle cx="110" cy="90" r="14" fill="#fed7aa" stroke="#293140" stroke-width="2.5"/>
      <rect x="100" y="80" width="12" height="20" fill="#fed7aa"/>
      
      <!-- Content -->
      <circle cx="55" cy="35" r="18" fill="#f97316" stroke="#293140" stroke-width="2"/>
      <text x="55" y="42" font-size="18" text-anchor="middle">🎯</text>
      <text x="55" y="75" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#c2410c" text-anchor="middle">KHỐI 1</text>
      <text x="55" y="92" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#7c2d12" text-anchor="middle">NHIỆM VỤ</text>
      <rect x="10" y="110" width="90" height="55" rx="6" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="55" y="128" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#293140" text-anchor="middle">Soạn thảo bản</text>
      <text x="55" y="142" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5" fill="#c2410c" text-anchor="middle">Hợp đồng LĐ</text>
      <text x="55" y="156" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">thời hạn 12 tháng</text>
    </g>

    <!-- BLOCK 2: NGỮ CẢNH (Pink) -->
    <g transform="translate(118, 0)">
      <rect x="0" y="0" width="115" height="180" rx="12" fill="#fbcfe8" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-4)"/>
      <!-- Puzzle Nub Right -->
      <circle cx="115" cy="90" r="14" fill="#fbcfe8" stroke="#293140" stroke-width="2.5"/>
      <rect x="105" y="80" width="12" height="20" fill="#fbcfe8"/>

      <!-- Content -->
      <circle cx="58" cy="35" r="18" fill="#db2777" stroke="#293140" stroke-width="2"/>
      <text x="58" y="42" font-size="18" text-anchor="middle">🏢</text>
      <text x="58" y="75" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#be185d" text-anchor="middle">KHỐI 2</text>
      <text x="58" y="92" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#831843" text-anchor="middle">NGỮ CẢNH</text>
      <rect x="10" y="110" width="95" height="55" rx="6" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="58" y="128" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#293140" text-anchor="middle">Chuyên viên Pháp chế</text>
      <text x="58" y="142" font-family="'Inter', sans-serif" font-weight="800" font-size="9.5" fill="#db2777" text-anchor="middle">Vị trí Sales</text>
      <text x="58" y="156" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Lương 12tr + HH</text>
    </g>

    <!-- BLOCK 3: THAM CHIẾU (Green - THE MASTER PIECE) -->
    <g transform="translate(242, 0)">
      <rect x="0" y="0" width="125" height="180" rx="12" fill="#bbf7d0" stroke="#293140" stroke-width="3" filter="url(#soft-shadow-4)"/>
      
      <!-- Content -->
      <circle cx="62" cy="35" r="18" fill="#16a34a" stroke="#293140" stroke-width="2"/>
      <text x="62" y="42" font-size="18" text-anchor="middle">⚓</text>
      <text x="62" y="75" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#15803d" text-anchor="middle">KHỐI 3</text>
      <text x="62" y="92" font-family="'Nunito', sans-serif" font-weight="1000" font-size="11" fill="#14532d" text-anchor="middle">THAM CHIẾU</text>
      <rect x="8" y="110" width="109" height="58" rx="6" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="62" y="125" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#15803d" text-anchor="middle">✔️ Luật LĐ 2019</text>
      <text x="62" y="139" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#15803d" text-anchor="middle">✔️ Mẫu HĐ công ty</text>
      <text x="62" y="154" font-family="'Inter', sans-serif" font-weight="900" font-size="8.5" fill="#dc2626" text-anchor="middle">🚫 Cấm giữ bằng gốc</text>
    </g>
  </g>

  <!-- Big Animated Arrow -->
  <g transform="translate(400, 105)">
    <polygon points="0,0 20,-16 20,-7 35,-7 35,7 20,7 20,16" fill="#f59e0b" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-4)"/>
  </g>

  <!-- Right: Shiny Gold Output Document -->
  <g transform="translate(442, 38)">
    <!-- Certificate / Document -->
    <rect x="0" y="0" width="75" height="105" rx="8" fill="#ffffff" stroke="#293140" stroke-width="2.5" filter="url(#neo-shadow-4)"/>
    <!-- Lines on doc -->
    <rect x="10" y="12" width="55" height="6" rx="2" fill="#3b82f6"/>
    <line x1="10" y1="26" x2="65" y2="26" stroke="#94a3b8" stroke-width="2"/>
    <line x1="10" y1="34" x2="65" y2="34" stroke="#94a3b8" stroke-width="2"/>
    <line x1="10" y1="42" x2="45" y2="42" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Red Ribbon Seal -->
    <circle cx="37" cy="65" r="15" fill="#ef4444" stroke="#293140" stroke-width="2"/>
    <polygon points="30,76 34,92 37,86 40,92 44,76" fill="#ef4444" stroke="#293140" stroke-width="1.5"/>
    <text x="37" y="70" font-family="'Nunito', sans-serif" font-weight="1000" font-size="10" fill="#ffffff" text-anchor="middle">100%</text>

    <!-- Bottom Stamp Badge -->
    <rect x="-8" y="112" width="91" height="26" rx="6" fill="#22c55e" stroke="#293140" stroke-width="2" filter="url(#soft-shadow-4)"/>
    <text x="37" y="129" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">DUYỆT NGAY! 🎉</text>
  </g>
</svg>