<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="100%" height="100%">
  <defs>
    <filter id="lego-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="lego-soft" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Outer Container -->
  <rect x="8" y="8" width="644" height="254" rx="20" fill="#fffdf5" stroke="#293140" stroke-width="3" filter="url(#lego-shadow)"/>

  <!-- Top Title Banner inside graphic -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="280" height="26" rx="8" fill="#fde047" stroke="#293140" stroke-width="2" filter="url(#lego-soft)"/>
    <text x="140" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#293140" text-anchor="middle">🧩 CỖ MÁY 3 KHỐI LEGO CÂU LỆNH CHUẨN</text>
  </g>

  <!-- MODULE 1: NHIỆM VỤ (x = 24, width = 136, y = 56, height = 186) -->
  <g transform="translate(24, 56)">
    <rect x="0" y="0" width="136" height="186" rx="14" fill="#ffedd5" stroke="#293140" stroke-width="2.5" filter="url(#lego-soft)"/>
    
    <!-- Top Badge Icon -->
    <circle cx="68" cy="34" r="20" fill="#f97316" stroke="#293140" stroke-width="2"/>
    <text x="68" y="42" font-size="18" text-anchor="middle">🎯</text>
    
    <text x="68" y="72" font-family="'Nunito', sans-serif" font-weight="900" font-size="13" fill="#c2410c" text-anchor="middle">KHỐI 1</text>
    <text x="68" y="88" font-family="'Nunito', sans-serif" font-weight="900" font-size="11.5" fill="#7c2d12" text-anchor="middle">NHIỆM VỤ</text>

    <!-- Inner content white card -->
    <rect x="10" y="102" width="116" height="72" rx="8" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
    <text x="68" y="122" font-family="'Nunito', sans-serif" font-weight="800" font-size="10.5" fill="#293140" text-anchor="middle">Soạn thảo bản</text>
    <text x="68" y="140" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#ea580c" text-anchor="middle">HỢP ĐỒNG LĐ</text>
    <text x="68" y="158" font-family="'Nunito', sans-serif" font-weight="700" font-size="9.5" fill="#64748b" text-anchor="middle">Thời hạn 12 tháng</text>
  </g>

  <!-- PLUS CONNECTOR 1 (x = 166, cy = 149) -->
  <g transform="translate(166, 137)">
    <circle cx="12" cy="12" r="12" fill="#ffffff" stroke="#293140" stroke-width="2" filter="url(#lego-soft)"/>
    <text x="12" y="17" font-family="'Nunito', sans-serif" font-weight="900" font-size="15" fill="#f97316" text-anchor="middle">+</text>
  </g>

  <!-- MODULE 2: NGỮ CẢNH (x = 196, width = 136, y = 56, height = 186) -->
  <g transform="translate(196, 56)">
    <rect x="0" y="0" width="136" height="186" rx="14" fill="#fce7f3" stroke="#293140" stroke-width="2.5" filter="url(#lego-soft)"/>
    
    <!-- Top Badge Icon -->
    <circle cx="68" cy="34" r="20" fill="#ec4899" stroke="#293140" stroke-width="2"/>
    <text x="68" y="42" font-size="18" text-anchor="middle">🏢</text>
    
    <text x="68" y="72" font-family="'Nunito', sans-serif" font-weight="900" font-size="13" fill="#be185d" text-anchor="middle">KHỐI 2</text>
    <text x="68" y="88" font-family="'Nunito', sans-serif" font-weight="900" font-size="11.5" fill="#831843" text-anchor="middle">NGỮ CẢNH</text>

    <!-- Inner content white card -->
    <rect x="10" y="102" width="116" height="72" rx="8" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
    <text x="68" y="122" font-family="'Nunito', sans-serif" font-weight="800" font-size="10" fill="#293140" text-anchor="middle">Pháp chế Sao Việt</text>
    <text x="68" y="140" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#db2777" text-anchor="middle">VỊ TRÍ SALES</text>
    <text x="68" y="158" font-family="'Nunito', sans-serif" font-weight="700" font-size="9.5" fill="#64748b" text-anchor="middle">Lương 12tr + Hoa hồng</text>
  </g>

  <!-- PLUS CONNECTOR 2 (x = 338, cy = 149) -->
  <g transform="translate(338, 137)">
    <circle cx="12" cy="12" r="12" fill="#ffffff" stroke="#293140" stroke-width="2" filter="url(#lego-soft)"/>
    <text x="12" y="17" font-family="'Nunito', sans-serif" font-weight="900" font-size="15" fill="#ec4899" text-anchor="middle">+</text>
  </g>

  <!-- MODULE 3: THAM CHIẾU (x = 368, width = 142, y = 56, height = 186 - HIGHLIGHTED) -->
  <g transform="translate(368, 56)">
    <!-- Golden aura ring -->
    <rect x="-3" y="-3" width="148" height="192" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="0" y="0" width="142" height="186" rx="14" fill="#bbf7d0" stroke="#293140" stroke-width="3" filter="url(#lego-soft)"/>
    
    <!-- Top Badge Icon -->
    <circle cx="71" cy="34" r="20" fill="#16a34a" stroke="#293140" stroke-width="2"/>
    <text x="71" y="42" font-size="18" text-anchor="middle">⚓</text>
    
    <text x="71" y="72" font-family="'Nunito', sans-serif" font-weight="1000" font-size="13" fill="#15803d" text-anchor="middle">KHỐI 3 (MỎ NEO)</text>
    <text x="71" y="88" font-family="'Nunito', sans-serif" font-weight="1000" font-size="11.5" fill="#14532d" text-anchor="middle">THAM CHIẾU</text>

    <!-- Inner content white card -->
    <rect x="8" y="102" width="126" height="72" rx="8" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
    <text x="71" y="120" font-family="'Nunito', sans-serif" font-weight="800" font-size="9.5" fill="#166534" text-anchor="middle">✔️ Luật LĐ 2019</text>
    <text x="71" y="136" font-family="'Nunito', sans-serif" font-weight="800" font-size="9.5" fill="#166534" text-anchor="middle">✔️ Mẫu HĐ công ty</text>
    <text x="71" y="154" font-family="'Nunito', sans-serif" font-weight="900" font-size="9.5" fill="#dc2626" text-anchor="middle">🚫 Cấm giữ bằng gốc</text>
  </g>

  <!-- OUTPUT ARROW (x = 516 to 546 - POINTING RIGHT!) -->
  <g transform="translate(518, 134)">
    <polygon points="0,5 14,5 14,-4 26,10 14,24 14,15 0,15" fill="#f59e0b" stroke="#293140" stroke-width="2.5" filter="url(#lego-soft)"/>
  </g>

  <!-- FINAL OUTPUT DOCUMENT (x = 552, width = 94, y = 56, height = 186) -->
  <g transform="translate(552, 56)">
    <!-- Document Card -->
    <rect x="0" y="0" width="94" height="142" rx="10" fill="#ffffff" stroke="#293140" stroke-width="2.5" filter="url(#lego-shadow)"/>
    
    <!-- Top Document Header Bar -->
    <rect x="10" y="12" width="74" height="8" rx="2" fill="#3b82f6"/>
    <!-- Realistic Contract Lines -->
    <line x1="10" y1="28" x2="84" y2="28" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="10" y1="36" x2="84" y2="36" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="10" y1="44" x2="60" y2="44" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="10" y1="52" x2="84" y2="52" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="10" y1="60" x2="50" y2="60" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Red Seal Badge with Ribbon -->
    <circle cx="47" cy="88" r="18" fill="#ef4444" stroke="#293140" stroke-width="2"/>
    <polygon points="38,102 43,120 47,112 51,120 56,102" fill="#ef4444" stroke="#293140" stroke-width="1.5"/>
    <text x="47" y="93" font-family="'Nunito', sans-serif" font-weight="1000" font-size="10.5" fill="#ffffff" text-anchor="middle">100%</text>

    <!-- Bottom Approved Pill (Centered perfectly) -->
    <g transform="translate(-2, 152)">
      <rect x="0" y="0" width="98" height="28" rx="8" fill="#22c55e" stroke="#293140" stroke-width="2" filter="url(#lego-soft)"/>
      <text x="49" y="19" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">DUYỆT NGAY! 👍</text>
    </g>
  </g>
</svg>