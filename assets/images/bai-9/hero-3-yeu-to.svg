<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" height="100%">
  <defs>
    <filter id="hero-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="hero-soft" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Comic Outer Frame -->
  <rect x="8" y="8" width="544" height="244" rx="20" fill="#fef9c3" stroke="#293140" stroke-width="3" filter="url(#hero-shadow)"/>
  
  <!-- Subtle decorative striped line -->
  <path d="M30 26 L530 26" stroke="#fde047" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- LEFT: BOSS CARTOON (x = 35, y = 44) -->
  <g transform="translate(35, 44)">
    <!-- Body -->
    <path d="M15 145 C15 110 35 96 65 96 C95 96 115 110 115 145 Z" fill="#3b82f6" stroke="#293140" stroke-width="3"/>
    <!-- Collar & Tie -->
    <polygon points="65,96 48,118 60,132 65,110 70,132 82,118" fill="#ffffff" stroke="#293140" stroke-width="2"/>
    <polygon points="65,108 60,128 65,142 70,128" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <!-- Head -->
    <ellipse cx="65" cy="58" rx="28" ry="30" fill="#ffd1b3" stroke="#293140" stroke-width="3"/>
    <!-- Hair -->
    <path d="M37 54 C37 32 46 22 65 22 C84 22 93 32 93 54 C86 42 76 40 65 40 C54 40 44 44 37 54 Z" fill="#4a2810" stroke="#293140" stroke-width="3"/>
    <!-- Glasses -->
    <rect x="44" y="50" width="18" height="14" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#293140" stroke-width="2.5"/>
    <rect x="68" y="50" width="18" height="14" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#293140" stroke-width="2.5"/>
    <line x1="62" y1="57" x2="68" y2="57" stroke="#293140" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="53" cy="57" r="2.5" fill="#293140"/>
    <circle cx="77" cy="57" r="2.5" fill="#293140"/>
    <!-- Smile -->
    <path d="M55 74 Q65 82 75 74" fill="none" stroke="#293140" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Mini Speech Badge -->
    <g transform="translate(16, -18)">
      <rect x="0" y="0" width="88" height="26" rx="8" fill="#ffffff" stroke="#293140" stroke-width="2" filter="url(#hero-soft)"/>
      <polygon points="36,26 44,34 42,26" fill="#ffffff" stroke="#293140" stroke-width="2"/>
      <line x1="37" y1="25" x2="43" y2="25" stroke="#ffffff" stroke-width="3"/>
      <text x="44" y="17" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#1e3a8a" text-anchor="middle">SẾP DUYỆT 👍</text>
    </g>
  </g>

  <!-- CENTER: 3 FORMULA BLOCKS STACKED (x = 195, y = 36, width = 170) -->
  <g transform="translate(195, 36)">
    <rect x="0" y="0" width="170" height="162" rx="16" fill="#ffffff" stroke="#293140" stroke-width="3.5" filter="url(#hero-shadow)"/>
    
    <!-- Header banner -->
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#f59e0b"/>
    <rect x="0" y="16" width="170" height="16" fill="#f59e0b"/>
    <line x1="0" y1="32" x2="170" y2="32" stroke="#293140" stroke-width="2.5"/>
    <text x="85" y="22" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">CÔNG THỨC 3 YẾU TỐ</text>

    <!-- Block 1: Nhiệm vụ -->
    <g transform="translate(12, 40)">
      <rect x="0" y="0" width="146" height="28" rx="8" fill="#fee2e2" stroke="#293140" stroke-width="2"/>
      <circle cx="18" cy="14" r="9" fill="#ef4444"/>
      <text x="18" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" text-anchor="middle">1</text>
      <text x="82" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#991b1b" text-anchor="middle">NHIỆM VỤ</text>
    </g>

    <!-- Plus 1 -->
    <text x="85" y="77" font-family="'Nunito', sans-serif" font-weight="900" font-size="13" fill="#293140" text-anchor="middle">+</text>

    <!-- Block 2: Ngữ cảnh -->
    <g transform="translate(12, 80)">
      <rect x="0" y="0" width="146" height="28" rx="8" fill="#fdf2f8" stroke="#293140" stroke-width="2"/>
      <circle cx="18" cy="14" r="9" fill="#ec4899"/>
      <text x="18" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" text-anchor="middle">2</text>
      <text x="82" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#9d174d" text-anchor="middle">NGỮ CẢNH</text>
    </g>

    <!-- Plus 2 -->
    <text x="85" y="117" font-family="'Nunito', sans-serif" font-weight="900" font-size="13" fill="#293140" text-anchor="middle">+</text>

    <!-- Block 3: Tham chiếu -->
    <g transform="translate(12, 120)">
      <rect x="0" y="0" width="146" height="30" rx="8" fill="#dcfce7" stroke="#293140" stroke-width="2.5"/>
      <circle cx="18" cy="15" r="9" fill="#16a34a"/>
      <text x="18" y="19" font-family="'Nunito', sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" text-anchor="middle">3</text>
      <text x="82" y="19" font-family="'Nunito', sans-serif" font-weight="1000" font-size="11.5" fill="#14532d" text-anchor="middle">THAM CHIẾU ⚓</text>
    </g>
  </g>

  <!-- RIGHT: CUTE ROBOT AI (x = 405, y = 38) -->
  <g transform="translate(405, 38)">
    <!-- Antenna -->
    <line x1="55" y1="28" x2="55" y2="10" stroke="#293140" stroke-width="3"/>
    <circle cx="55" cy="8" r="8" fill="#f59e0b" stroke="#293140" stroke-width="2.5"/>
    <circle cx="58" cy="6" r="2" fill="#ffffff"/>
    
    <!-- Body -->
    <path d="M28 150 C28 126 38 116 55 116 C72 116 82 126 82 150 Z" fill="#ffffff" stroke="#293140" stroke-width="3"/>
    <rect x="44" y="128" width="22" height="12" rx="4" fill="#22c55e" stroke="#293140" stroke-width="2"/>
    <!-- Neck -->
    <rect x="47" y="104" width="16" height="14" rx="3" fill="#cbd5e1" stroke="#293140" stroke-width="2"/>
    
    <!-- Ears -->
    <rect x="14" y="56" width="10" height="22" rx="4" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <rect x="86" y="56" width="10" height="22" rx="4" fill="#f59e0b" stroke="#293140" stroke-width="2"/>

    <!-- Head Box -->
    <rect x="22" y="28" width="66" height="60" rx="16" fill="#38bdf8" stroke="#293140" stroke-width="3"/>
    <!-- Screen Face -->
    <rect x="30" y="36" width="50" height="44" rx="10" fill="#1e293b"/>
    <!-- Glowing Cyan Eyes -->
    <ellipse cx="42" cy="54" rx="6.5" ry="8" fill="#00f2fe"/>
    <circle cx="40" cy="51" r="2" fill="#ffffff"/>
    <ellipse cx="68" cy="54" rx="6.5" ry="8" fill="#00f2fe"/>
    <circle cx="66" cy="51" r="2" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M48 68 Q55 75 62 68" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>

    <!-- Mini Speech Badge -->
    <g transform="translate(36, -18)">
      <rect x="0" y="0" width="80" height="26" rx="8" fill="#ffffff" stroke="#293140" stroke-width="2" filter="url(#hero-soft)"/>
      <polygon points="20,26 28,34 26,26" fill="#ffffff" stroke="#293140" stroke-width="2"/>
      <line x1="21" y1="25" x2="27" y2="25" stroke="#ffffff" stroke-width="3"/>
      <text x="40" y="17" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#15803d" text-anchor="middle">CHUẨN 100% 🎉</text>
    </g>
  </g>

  <!-- BOTTOM PILL BANNER -->
  <g transform="translate(135, 212)">
    <rect x="0" y="0" width="290" height="32" rx="16" fill="#3b82f6" stroke="#293140" stroke-width="2.5" filter="url(#hero-soft)"/>
    <text x="145" y="21" font-family="'Nunito', sans-serif" font-weight="900" font-size="12.5" fill="#ffffff" text-anchor="middle">🛡️ KHỐNG CHẾ ẢO GIÁC — BẢO ĐẢM PHÁP LÝ</text>
  </g>
</svg>