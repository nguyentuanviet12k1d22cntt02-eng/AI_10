<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <defs>
    <filter id="neo-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background decorative dots & burst -->
  <g opacity="0.4">
    <circle cx="30" cy="40" r="3" fill="#293140"/>
    <circle cx="50" cy="30" r="2" fill="#293140"/>
    <circle cx="430" cy="50" r="3" fill="#293140"/>
    <circle cx="410" cy="35" r="2" fill="#293140"/>
    <circle cx="40" cy="220" r="3" fill="#293140"/>
    <circle cx="420" cy="210" r="3" fill="#293140"/>
  </g>

  <!-- Cartoon Comic Backdrop Badge -->
  <rect x="25" y="20" width="410" height="215" rx="20" fill="#fef9c3" stroke="#293140" stroke-width="3.5" filter="url(#neo-shadow)"/>
  
  <!-- Halftone / Stripes inside backdrop -->
  <path d="M45 35 L415 35" stroke="#fde047" stroke-width="4" stroke-dasharray="8 6"/>
  
  <!-- Left Character: Boss Cartoon -->
  <g transform="translate(45, 45)">
    <!-- Body -->
    <path d="M15 150 C15 110 35 95 65 95 C95 95 115 110 115 150 Z" fill="#3b82f6" stroke="#293140" stroke-width="3"/>
    <!-- Collar & Tie -->
    <polygon points="65,95 48,118 60,132 65,110 70,132 82,118" fill="#ffffff" stroke="#293140" stroke-width="2"/>
    <polygon points="65,108 60,128 65,142 70,128" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <!-- Head -->
    <ellipse cx="65" cy="60" rx="30" ry="32" fill="#ffd1b3" stroke="#293140" stroke-width="3"/>
    <!-- Hair -->
    <path d="M35 55 C35 32 46 22 65 22 C84 22 95 32 95 55 C88 42 77 40 65 40 C53 40 43 45 35 55 Z" fill="#4a2810" stroke="#293140" stroke-width="3"/>
    <!-- Glasses -->
    <rect x="42" y="52" width="20" height="16" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#293140" stroke-width="2.5"/>
    <rect x="68" y="52" width="20" height="16" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#293140" stroke-width="2.5"/>
    <line x1="62" y1="60" x2="68" y2="60" stroke="#293140" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="52" cy="60" r="3" fill="#293140"/>
    <circle cx="78" cy="60" r="3" fill="#293140"/>
    <circle cx="53" cy="59" r="1" fill="#ffffff"/>
    <circle cx="79" cy="59" r="1" fill="#ffffff"/>
    <!-- Big Happy Smile -->
    <path d="M54 76 Q65 86 76 76" fill="none" stroke="#293140" stroke-width="3" stroke-linecap="round"/>
    <!-- Speech bubble mini -->
    <g transform="translate(10, -15)">
      <rect x="0" y="0" width="75" height="26" rx="8" fill="#ffffff" stroke="#293140" stroke-width="2" filter="url(#soft-shadow)"/>
      <polygon points="40,26 48,34 46,26" fill="#ffffff" stroke="#293140" stroke-width="2"/>
      <line x1="41" y1="25" x2="47" y2="25" stroke="#ffffff" stroke-width="3"/>
      <text x="37" y="17" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#1e3a8a" text-anchor="middle">CHUẨN 100%</text>
    </g>
  </g>

  <!-- Right Character: Cute Robot AI -->
  <g transform="translate(290, 40)">
    <!-- Antenna -->
    <line x1="60" y1="30" x2="60" y2="10" stroke="#293140" stroke-width="3"/>
    <circle cx="60" cy="8" r="8" fill="#f59e0b" stroke="#293140" stroke-width="2.5"/>
    <circle cx="63" cy="6" r="2" fill="#ffffff"/>
    <!-- Body -->
    <path d="M30 155 C30 130 42 120 60 120 C78 120 90 130 90 155 Z" fill="#ffffff" stroke="#293140" stroke-width="3"/>
    <rect x="48" y="132" width="24" height="12" rx="4" fill="#22c55e" stroke="#293140" stroke-width="2"/>
    <!-- Neck -->
    <rect x="52" y="108" width="16" height="14" rx="3" fill="#cbd5e1" stroke="#293140" stroke-width="2"/>
    <!-- Ears -->
    <rect x="18" y="58" width="10" height="24" rx="5" fill="#f59e0b" stroke="#293140" stroke-width="2.5"/>
    <rect x="92" y="58" width="10" height="24" rx="5" fill="#f59e0b" stroke="#293140" stroke-width="2.5"/>
    <!-- Head Box -->
    <rect x="25" y="30" width="70" height="64" rx="16" fill="#38bdf8" stroke="#293140" stroke-width="3"/>
    <!-- Screen Face -->
    <rect x="33" y="38" width="54" height="46" rx="10" fill="#1e293b"/>
    <!-- Glowing Cyan Eyes -->
    <ellipse cx="46" cy="58" rx="7" ry="9" fill="#00f2fe"/>
    <circle cx="44" cy="54" r="2.5" fill="#ffffff"/>
    <ellipse cx="74" cy="58" rx="7" ry="9" fill="#00f2fe"/>
    <circle cx="72" cy="54" r="2.5" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M52 72 Q60 80 68 72" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
    <!-- Thumbs up badge -->
    <g transform="translate(65, 0)">
      <circle cx="20" cy="20" r="16" fill="#dcfce7" stroke="#293140" stroke-width="2" filter="url(#soft-shadow)"/>
      <text x="20" y="26" font-size="16" text-anchor="middle">👍</text>
    </g>
  </g>

  <!-- Center Piece: 3 Golden Formula Blocks stacked -->
  <g transform="translate(160, 48)">
    <!-- Connecting energy glow -->
    <rect x="0" y="0" width="140" height="155" rx="16" fill="#ffffff" stroke="#293140" stroke-width="3.5" filter="url(#neo-shadow)"/>
    
    <!-- Top banner -->
    <rect x="0" y="0" width="140" height="30" rx="16" fill="#f59e0b"/>
    <rect x="0" y="16" width="140" height="14" fill="#f59e0b"/>
    <line x1="0" y1="30" x2="140" y2="30" stroke="#293140" stroke-width="3"/>
    <text x="70" y="21" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">CÔNG THỨC VÀNG</text>

    <!-- Block 1: Nhiệm vụ -->
    <g transform="translate(10, 38)">
      <rect x="0" y="0" width="120" height="28" rx="7" fill="#fee2e2" stroke="#293140" stroke-width="2"/>
      <circle cx="16" cy="14" r="9" fill="#ef4444"/>
      <text x="16" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">1</text>
      <text x="68" y="18" font-family="'Nunito', sans-serif" font-weight="800" font-size="11" fill="#991b1b" text-anchor="middle">NHIỆM VỤ</text>
    </g>

    <!-- Plus 1 -->
    <text x="70" y="74" font-family="'Nunito', sans-serif" font-weight="900" font-size="13" fill="#293140" text-anchor="middle">+</text>

    <!-- Block 2: Ngữ cảnh -->
    <g transform="translate(10, 77)">
      <rect x="0" y="0" width="120" height="28" rx="7" fill="#fdf2f8" stroke="#293140" stroke-width="2"/>
      <circle cx="16" cy="14" r="9" fill="#ec4899"/>
      <text x="16" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">2</text>
      <text x="68" y="18" font-family="'Nunito', sans-serif" font-weight="800" font-size="11" fill="#9d174d" text-anchor="middle">NGỮ CẢNH</text>
    </g>

    <!-- Plus 2 -->
    <text x="70" y="113" font-family="'Nunito', sans-serif" font-weight="900" font-size="13" fill="#293140" text-anchor="middle">+</text>

    <!-- Block 3: Tham chiếu (SUPER HIGHLIGHTED) -->
    <g transform="translate(10, 116)">
      <rect x="0" y="0" width="120" height="30" rx="7" fill="#dcfce7" stroke="#293140" stroke-width="2.5"/>
      <circle cx="16" cy="15" r="9" fill="#16a34a"/>
      <text x="16" y="19" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">3</text>
      <text x="68" y="19" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#14532d" text-anchor="middle">THAM CHIẾU ⚓</text>
    </g>
  </g>

  <!-- Sparkles & Stars -->
  <g fill="#f59e0b" stroke="#293140" stroke-width="1.5">
    <path d="M145 32 L148 40 L156 43 L148 46 L145 54 L142 46 L134 43 L142 40 Z"/>
    <path d="M315 28 L318 35 L325 38 L318 41 L315 48 L312 41 L305 38 L312 35 Z"/>
    <path d="M230 220 L233 226 L239 228 L233 230 L230 236 L227 230 L221 228 L227 226 Z"/>
  </g>

  <!-- Bottom Cartoon Banner Pill -->
  <g transform="translate(95, 215)">
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#3b82f6" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow)"/>
    <text x="135" y="21" font-family="'Nunito', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">🛡️ KHỐNG CHẾ ẢO GIÁC - CHUẨN PHÁP LÝ</text>
  </g>
</svg>