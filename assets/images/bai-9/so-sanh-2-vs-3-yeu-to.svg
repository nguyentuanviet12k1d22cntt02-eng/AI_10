<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="100%">
  <defs>
    <filter id="duel-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="duel-soft" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="8" y="8" width="624" height="264" rx="20" fill="#f8fafc" stroke="#293140" stroke-width="3" filter="url(#duel-shadow)"/>

  <!-- LEFT FIGHTER: 2 YẾU TỐ (x = 24, width = 265) -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="265" height="236" rx="16" fill="#fff7ed" stroke="#293140" stroke-width="2.5" filter="url(#duel-soft)"/>
    
    <!-- Top Pill -->
    <rect x="14" y="14" width="237" height="34" rx="10" fill="#ffedd5" stroke="#293140" stroke-width="2"/>
    <text x="132" y="36" font-family="'Nunito', sans-serif" font-weight="900" font-size="12.5" fill="#c2410c" text-anchor="middle">⚠️ CÂU LỆNH 2 YẾU TỐ</text>

    <!-- Subtitle -->
    <text x="132" y="66" font-family="'Nunito', sans-serif" font-weight="800" font-size="11" fill="#9a3412" text-anchor="middle">THIẾU MỎ NEO THAM CHIẾU</text>

    <!-- Confused Robot Face Mascot -->
    <g transform="translate(132, 102)">
      <!-- Head Box -->
      <rect x="-36" y="-30" width="72" height="54" rx="12" fill="#fed7aa" stroke="#293140" stroke-width="2.5"/>
      <rect x="-44" y="-12" width="8" height="18" rx="3" fill="#ea580c" stroke="#293140" stroke-width="1.5"/>
      <rect x="36" y="-12" width="8" height="18" rx="3" fill="#ea580c" stroke="#293140" stroke-width="1.5"/>
      <!-- Screen Face -->
      <rect x="-28" y="-22" width="56" height="38" rx="8" fill="#1e293b"/>
      <!-- Swirl Eyes -->
      <circle cx="-14" cy="-4" r="7" fill="none" stroke="#f97316" stroke-width="2"/>
      <circle cx="-14" cy="-4" r="3" fill="#f97316"/>
      <circle cx="14" cy="-4" r="7" fill="none" stroke="#f97316" stroke-width="2"/>
      <circle cx="14" cy="-4" r="3" fill="#f97316"/>
      <!-- Dizzy mouth -->
      <path d="M-10 9 Q-5 4 0 9 Q5 14 10 9" fill="none" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
      <!-- Sweat drop -->
      <path d="M26 -16 C30 -24 34 -18 30 -12 C27 -9 23 -12 26 -16 Z" fill="#38bdf8" stroke="#293140" stroke-width="1"/>
    </g>

    <!-- Comic Scorecard -->
    <g transform="translate(14, 146)">
      <rect x="0" y="0" width="237" height="76" rx="10" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="14" y="22" font-family="'Nunito', sans-serif" font-weight="900" font-size="11.5" fill="#dc2626">❌ Rủi ro ảo giác: ~60%</text>
      <text x="14" y="40" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#64748b">• AI tự chế điều khoản trên mạng</text>
      <text x="14" y="55" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#64748b">• Sếp phải rà soát sửa lại 3 - 4 lần</text>
      <text x="14" y="70" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#ea580c">👉 Chỉ dùng cho: Email, ý tưởng ngắn</text>
    </g>
  </g>

  <!-- CENTER: COMIC VS BADGE (cx = 320) -->
  <g transform="translate(320, 140)">
    <polygon points="0,-32 10,-12 32,-15 16,3 28,24 6,14 -10,32 -14,10 -32,8 -16,-6 -26,-24 -5,-14" 
             fill="#fde047" stroke="#293140" stroke-width="3" filter="url(#duel-shadow)"/>
    <text x="0" y="7" font-family="'Nunito', sans-serif" font-weight="1000" font-size="16" fill="#1e3a8a" text-anchor="middle">VS</text>
  </g>

  <!-- RIGHT FIGHTER: 3 YẾU TỐ (x = 351, width = 265) -->
  <g transform="translate(351, 22)">
    <rect x="0" y="0" width="265" height="236" rx="16" fill="#f0fdf4" stroke="#293140" stroke-width="2.5" filter="url(#duel-soft)"/>
    
    <!-- Top Pill -->
    <rect x="14" y="14" width="237" height="34" rx="10" fill="#dcfce7" stroke="#293140" stroke-width="2"/>
    <text x="132" y="36" font-family="'Nunito', sans-serif" font-weight="900" font-size="12.5" fill="#166534" text-anchor="middle">🌟 CÂU LỆNH 3 YẾU TỐ</text>

    <!-- Subtitle -->
    <text x="132" y="66" font-family="'Nunito', sans-serif" font-weight="800" font-size="11" fill="#15803d" text-anchor="middle">KHÓA CHẶT MỎ NEO THAM CHIẾU</text>

    <!-- Superhero Robot Face Mascot -->
    <g transform="translate(132, 102)">
      <!-- Head Box -->
      <rect x="-36" y="-30" width="72" height="54" rx="12" fill="#38bdf8" stroke="#293140" stroke-width="2.5"/>
      <rect x="-44" y="-12" width="8" height="18" rx="3" fill="#f59e0b" stroke="#293140" stroke-width="1.5"/>
      <rect x="36" y="-12" width="8" height="18" rx="3" fill="#f59e0b" stroke="#293140" stroke-width="1.5"/>
      <!-- Screen Face -->
      <rect x="-28" y="-22" width="56" height="38" rx="8" fill="#1e293b"/>
      
      <!-- Cool Hero Sunglasses -->
      <polygon points="-24,-12 24,-12 20,4 -20,4" fill="#f59e0b" stroke="#293140" stroke-width="1.5"/>
      <line x1="-16" y1="-8" x2="16" y2="-8" stroke="#ffffff" stroke-width="2"/>

      <!-- Confident Smile -->
      <path d="M-10 8 Q0 16 10 8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Golden Crown on top -->
      <polygon points="-12,-30 -16,-40 -5,-34 0,-42 5,-34 16,-40 12,-30" fill="#facc15" stroke="#293140" stroke-width="1.5"/>
    </g>

    <!-- Comic Scorecard -->
    <g transform="translate(14, 146)">
      <rect x="0" y="0" width="237" height="76" rx="10" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="14" y="22" font-family="'Nunito', sans-serif" font-weight="1000" font-size="11.5" fill="#15803d">🛡️ Rủi ro ảo giác: 0%</text>
      <text x="14" y="40" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#166534">• Khớp 100% Luật VN &amp; Mẫu công ty</text>
      <text x="14" y="55" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#166534">• Sếp duyệt ngay lần đầu tiên</text>
      <text x="14" y="70" font-family="'Nunito', sans-serif" font-weight="1000" font-size="10" fill="#15803d">👉 Bắt buộc: Hợp đồng, quy chế, công văn</text>
    </g>
  </g>
</svg>