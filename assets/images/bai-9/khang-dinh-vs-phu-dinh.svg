<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <filter id="neo-shadow-3" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="soft-shadow-3" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="10" y="10" width="520" height="260" rx="18" fill="#f8fafc" stroke="#293140" stroke-width="3" filter="url(#neo-shadow-3)"/>

  <!-- LEFT CARD: KHẲNG ĐỊNH (GREEN COMPASS & GUIDE) -->
  <g transform="translate(25, 25)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="225" height="230" rx="14" fill="#f0fdf4" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-3)"/>
    
    <!-- Header Pill -->
    <rect x="12" y="12" width="201" height="32" rx="8" fill="#dcfce7" stroke="#293140" stroke-width="2"/>
    <text x="112" y="32" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#166534" text-anchor="middle">📌 1. THAM CHIẾU KHẲNG ĐỊNH</text>

    <!-- Subtitle -->
    <text x="112" y="60" font-family="'Nunito', sans-serif" font-weight="800" font-size="11" fill="#15803d" text-anchor="middle">CHỈ DẪN: "NÊN DỰA VÀO ĐÂU"</text>

    <!-- Cartoon Mascot: Compass & Law Book -->
    <g transform="translate(68, 70)">
      <!-- Book -->
      <rect x="-35" y="15" width="70" height="48" rx="6" fill="#86efac" stroke="#293140" stroke-width="2.5"/>
      <rect x="-30" y="20" width="60" height="38" rx="4" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <line x1="-22" y1="28" x2="10" y2="28" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
      <line x1="-22" y1="36" x2="20" y2="36" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
      <line x1="-22" y1="44" x2="0" y2="44" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>

      <!-- Glowing Compass on top -->
      <circle cx="28" cy="18" r="22" fill="#ffffff" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-3)"/>
      <circle cx="28" cy="18" r="17" fill="#dbeafe"/>
      <!-- Compass Needle -->
      <polygon points="28,4 32,18 28,15 24,18" fill="#ef4444" stroke="#293140" stroke-width="1"/>
      <polygon points="28,32 32,18 28,21 24,18" fill="#3b82f6" stroke="#293140" stroke-width="1"/>
      <circle cx="28" cy="18" r="3" fill="#293140"/>
    </g>

    <!-- Speech / Rule Box -->
    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="195" height="70" rx="8" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="10" y="20" font-family="'Nunito', sans-serif" font-weight="900" font-size="10.5" fill="#166534">✔️ Nêu nguồn luật, chuẩn mẫu:</text>
      <text x="10" y="36" font-family="'Inter', sans-serif" font-size="9.5" fill="#334155">• Căn cứ Bộ luật Lao động 2019</text>
      <text x="10" y="50" font-family="'Inter', sans-serif" font-size="9.5" fill="#334155">• Tuân theo mẫu Hợp đồng ISO công ty</text>
      <text x="10" y="64" font-family="'Inter', sans-serif" font-size="9.5" fill="#334155">• Lấy số liệu từ file Excel đính kèm</text>
    </g>
  </g>

  <!-- CENTER: COMIC VS BADGE -->
  <g transform="translate(270, 135)">
    <!-- Cartoon Explosion Star -->
    <polygon points="0,-32 10,-12 32,-15 16,3 28,24 6,14 -10,32 -14,10 -32,8 -16,-6 -26,-24 -5,-14" 
             fill="#fde047" stroke="#293140" stroke-width="3" filter="url(#neo-shadow-3)"/>
    <text x="0" y="6" font-family="'Nunito', sans-serif" font-weight="1000" font-size="16" fill="#dc2626" text-anchor="middle">VS</text>
  </g>

  <!-- RIGHT CARD: PHỦ ĐỊNH (RED LASER SHIELD & STOP) -->
  <g transform="translate(290, 25)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="225" height="230" rx="14" fill="#fef2f2" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-3)"/>
    
    <!-- Header Pill -->
    <rect x="12" y="12" width="201" height="32" rx="8" fill="#fee2e2" stroke="#293140" stroke-width="2"/>
    <text x="112" y="32" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#991b1b" text-anchor="middle">🚫 2. THAM CHIẾU PHỦ ĐỊNH</text>

    <!-- Subtitle -->
    <text x="112" y="60" font-family="'Nunito', sans-serif" font-weight="800" font-size="11" fill="#dc2626" text-anchor="middle">RÀO CHẮN: "CẤM TUYỆT ĐỐI"</text>

    <!-- Cartoon Mascot: Stop Shield & Siren -->
    <g transform="translate(112, 102)">
      <!-- Red Shield -->
      <path d="M0 -30 L28 -18 C28 10 16 32 0 42 C-16 32 -28 10 -28 -18 Z" 
            fill="#f87171" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-3)"/>
      <path d="M0 -22 L20 -12 C20 8 10 24 0 32 C-10 24 -20 8 -20 -12 Z" 
            fill="#ef4444"/>
      
      <!-- Hand Stop Sign / Cross mark -->
      <circle cx="0" cy="5" r="12" fill="#ffffff" stroke="#293140" stroke-width="2"/>
      <line x1="-7" y1="-2" x2="7" y2="12" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <line x1="7" y1="-2" x2="-7" y2="12" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

      <!-- Siren Alert on Top -->
      <rect x="-8" y="-40" width="16" height="8" rx="2" fill="#cbd5e1" stroke="#293140" stroke-width="1.5"/>
      <path d="M-6 -40 C-6 -46 6 -46 6 -40 Z" fill="#fbbf24" stroke="#293140" stroke-width="1.5"/>
      <!-- Flashes -->
      <line x1="-12" y1="-44" x2="-18" y2="-48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="-44" x2="18" y2="-48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Speech / Rule Box -->
    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="195" height="70" rx="8" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="10" y="20" font-family="'Nunito', sans-serif" font-weight="900" font-size="10.5" fill="#991b1b">🛑 Rào chắn chống rủi ro:</text>
      <text x="10" y="36" font-family="'Inter', sans-serif" font-size="9.5" fill="#334155">• Cấm phạt tiền, cắt lương sai luật</text>
      <text x="10" y="50" font-family="'Inter', sans-serif" font-size="9.5" fill="#334155">• Cấm tự ý bịa đặt số liệu ngoài hồ sơ</text>
      <text x="10" y="64" font-family="'Inter', sans-serif" font-size="9.5" fill="#334155">• Cấm ngôn từ mơ hồ gây tranh chấp</text>
    </g>
  </g>
</svg>