<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="100%" height="100%">
  <defs>
    <filter id="vs-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="vs-soft" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="8" y="8" width="624" height="264" rx="20" fill="#f8fafc" stroke="#293140" stroke-width="3" filter="url(#vs-shadow)"/>

  <!-- LEFT CARD: KHẲNG ĐỊNH (GREEN COMPASS & GUIDE) (x = 24, width = 265) -->
  <g transform="translate(24, 22)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="265" height="236" rx="16" fill="#f0fdf4" stroke="#293140" stroke-width="2.5" filter="url(#vs-soft)"/>
    
    <!-- Header Pill -->
    <rect x="14" y="14" width="237" height="34" rx="10" fill="#dcfce7" stroke="#293140" stroke-width="2"/>
    <text x="132" y="36" font-family="'Nunito', sans-serif" font-weight="900" font-size="12.5" fill="#166534" text-anchor="middle">📌 1. THAM CHIẾU KHẲNG ĐỊNH</text>

    <!-- Subtitle -->
    <text x="132" y="66" font-family="'Nunito', sans-serif" font-weight="900" font-size="11.5" fill="#15803d" text-anchor="middle">LA BÀN CHỈ ĐƯỜNG: "NÊN DỰA VÀO ĐÂU"</text>

    <!-- Cartoon Mascot: Compass & Law Book -->
    <g transform="translate(85, 78)">
      <!-- Book -->
      <rect x="-35" y="14" width="70" height="46" rx="6" fill="#86efac" stroke="#293140" stroke-width="2.5"/>
      <rect x="-30" y="19" width="60" height="36" rx="4" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <line x1="-22" y1="27" x2="10" y2="27" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
      <line x1="-22" y1="35" x2="20" y2="35" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
      <line x1="-22" y1="43" x2="0" y2="43" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>

      <!-- Glowing Compass on top -->
      <circle cx="35" cy="18" r="22" fill="#ffffff" stroke="#293140" stroke-width="2.5" filter="url(#vs-soft)"/>
      <circle cx="35" cy="18" r="17" fill="#dbeafe"/>
      <!-- Compass Needle -->
      <polygon points="35,4 39,18 35,15 31,18" fill="#ef4444" stroke="#293140" stroke-width="1"/>
      <polygon points="35,32 39,18 35,21 31,18" fill="#3b82f6" stroke="#293140" stroke-width="1"/>
      <circle cx="35" cy="18" r="3" fill="#293140"/>
    </g>

    <!-- Speech / Rule Box -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="237" height="72" rx="10" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="14" y="22" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#166534">✔️ Nêu nguồn luật, chuẩn mẫu:</text>
      <text x="14" y="40" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#334155">• Căn cứ Bộ luật Lao động 2019</text>
      <text x="14" y="54" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#334155">• Tuân thủ biểu mẫu ISO công ty</text>
      <text x="14" y="68" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#334155">• Bám sát file số liệu Excel đính kèm</text>
    </g>
  </g>

  <!-- CENTER: COMIC VS BADGE (cx = 320) -->
  <g transform="translate(320, 140)">
    <!-- Cartoon Explosion Star -->
    <polygon points="0,-32 10,-12 32,-15 16,3 28,24 6,14 -10,32 -14,10 -32,8 -16,-6 -26,-24 -5,-14" 
             fill="#fde047" stroke="#293140" stroke-width="3" filter="url(#vs-shadow)"/>
    <text x="0" y="7" font-family="'Nunito', sans-serif" font-weight="1000" font-size="16" fill="#dc2626" text-anchor="middle">VS</text>
  </g>

  <!-- RIGHT CARD: PHỦ ĐỊNH (RED LASER SHIELD & STOP) (x = 351, width = 265) -->
  <g transform="translate(351, 22)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="265" height="236" rx="16" fill="#fef2f2" stroke="#293140" stroke-width="2.5" filter="url(#vs-soft)"/>
    
    <!-- Header Pill -->
    <rect x="14" y="14" width="237" height="34" rx="10" fill="#fee2e2" stroke="#293140" stroke-width="2"/>
    <text x="132" y="36" font-family="'Nunito', sans-serif" font-weight="900" font-size="12.5" fill="#991b1b" text-anchor="middle">🚫 2. THAM CHIẾU PHỦ ĐỊNH</text>

    <!-- Subtitle -->
    <text x="132" y="66" font-family="'Nunito', sans-serif" font-weight="900" font-size="11.5" fill="#dc2626" text-anchor="middle">RÀO CHẮN: "CẤM TUYỆT ĐỐI ĐIỀU NÀY"</text>

    <!-- Cartoon Mascot: Stop Shield & Siren -->
    <g transform="translate(132, 106)">
      <!-- Red Shield -->
      <path d="M0 -30 L28 -18 C28 10 16 32 0 42 C-16 32 -28 10 -28 -18 Z" 
            fill="#f87171" stroke="#293140" stroke-width="2.5" filter="url(#vs-soft)"/>
      <path d="M0 -22 L20 -12 C20 8 10 24 0 32 C-10 24 -20 8 -20 -12 Z" 
            fill="#ef4444"/>
      
      <!-- Hand Stop Sign / Cross mark -->
      <circle cx="0" cy="5" r="12" fill="#ffffff" stroke="#293140" stroke-width="2"/>
      <line x1="-7" y1="-2" x2="7" y2="12" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <line x1="7" y1="-2" x2="-7" y2="12" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

      <!-- Siren Alert on Top -->
      <rect x="-8" y="-40" width="16" height="8" rx="2" fill="#cbd5e1" stroke="#293140" stroke-width="1.5"/>
      <path d="M-6 -40 C-6 -46 6 -46 6 -40 Z" fill="#fbbf24" stroke="#293140" stroke-width="1.5"/>
      <line x1="-12" y1="-44" x2="-18" y2="-48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="-44" x2="18" y2="-48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Speech / Rule Box -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="237" height="72" rx="10" fill="#ffffff" stroke="#293140" stroke-width="1.5"/>
      <text x="14" y="22" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#991b1b">🛑 Rào chắn chống rủi ro:</text>
      <text x="14" y="40" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#334155">• Cấm phạt tiền, cắt lương sai luật</text>
      <text x="14" y="54" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#334155">• Cấm tự ý bịa đặt số liệu ngoài hồ sơ</text>
      <text x="14" y="68" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#334155">• Cấm ngôn từ mơ hồ gây tranh chấp</text>
    </g>
  </g>
</svg>