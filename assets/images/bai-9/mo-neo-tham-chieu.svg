<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <filter id="anchor-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="anchor-soft" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Outer Container -->
  <rect x="8" y="8" width="624" height="304" rx="20" fill="#f0f9ff" stroke="#293140" stroke-width="3" filter="url(#anchor-shadow)"/>

  <!-- TOP-LEFT: Cloud of Hallucination (Mây Ảo Giác) -->
  <g transform="translate(25, 20)">
    <path d="M45 55 C20 55 10 38 28 22 C22 5 50 -6 68 10 C85 -10 118 -5 128 16 C150 12 168 28 156 50 C172 68 150 88 128 82 C112 94 78 94 62 78 C45 88 28 72 45 55 Z" 
          fill="#fee2e2" stroke="#293140" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="92" y="42" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#dc2626" text-anchor="middle">☁️ MÂY ẢO GIÁC</text>
    <text x="92" y="58" font-family="'Nunito', sans-serif" font-weight="800" font-size="9.5" fill="#991b1b" text-anchor="middle">Tự chế luật, bịa số liệu</text>
    <!-- Warning exclamation badge -->
    <circle cx="160" cy="24" r="12" fill="#ef4444" stroke="#293140" stroke-width="2"/>
    <text x="160" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">!</text>
  </g>

  <!-- CENTER: Cute Balloon Robot AI -->
  <g transform="translate(235, 20)">
    <!-- Antenna -->
    <line x1="85" y1="20" x2="85" y2="6" stroke="#293140" stroke-width="3"/>
    <circle cx="85" cy="5" r="6" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    
    <!-- Balloon Robot Head Box -->
    <rect x="35" y="20" width="100" height="88" rx="22" fill="#38bdf8" stroke="#293140" stroke-width="3.5" filter="url(#anchor-shadow)"/>
    <!-- Ears -->
    <rect x="23" y="50" width="12" height="24" rx="4" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <rect x="135" y="50" width="12" height="24" rx="4" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    
    <!-- Screen Face -->
    <rect x="46" y="30" width="78" height="66" rx="14" fill="#1e293b"/>
    <!-- Relieved & Happy Robot Eyes -->
    <ellipse cx="66" cy="56" rx="9" ry="11" fill="#00f2fe"/>
    <circle cx="63" cy="51" r="3.5" fill="#ffffff"/>
    <ellipse cx="104" cy="56" rx="9" ry="11" fill="#00f2fe"/>
    <circle cx="101" cy="51" r="3.5" fill="#ffffff"/>
    
    <!-- Cute Robot Smile -->
    <path d="M74 74 Q85 84 96 74" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="58" cy="74" r="5" fill="#fb7185" opacity="0.8"/>
    <circle cx="112" cy="74" r="5" fill="#fb7185" opacity="0.8"/>

    <!-- Heavy Cable & Chain Links downward to anchor -->
    <line x1="85" y1="108" x2="85" y2="150" stroke="#293140" stroke-width="4"/>
    <circle cx="85" cy="118" r="6" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="85" cy="130" r="6" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="85" cy="142" r="6" fill="none" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- RIGHT: Speech Bubble from Robot -->
  <g transform="translate(425, 36)">
    <rect x="0" y="0" width="185" height="54" rx="12" fill="#ffffff" stroke="#293140" stroke-width="2.5" filter="url(#anchor-soft)"/>
    <!-- Pointer triangle to left -->
    <polygon points="0,28 -12,22 0,16" fill="#ffffff" stroke="#293140" stroke-width="2"/>
    <line x1="1" y1="17" x2="1" y2="27" stroke="#ffffff" stroke-width="3"/>
    <text x="92" y="23" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#1e40af" text-anchor="middle">May quá có Mỏ Neo!</text>
    <text x="92" y="41" font-family="'Nunito', sans-serif" font-weight="800" font-size="10.5" fill="#15803d" text-anchor="middle">Bám sát thực tế, không sợ lạc! ⚓</text>
  </g>

  <!-- BOTTOM FOUNDATION: Solid Bedrock Ground -->
  <g transform="translate(24, 215)">
    <!-- Base Rock Floor -->
    <rect x="0" y="45" width="592" height="42" rx="10" fill="#e2e8f0" stroke="#293140" stroke-width="3"/>

    <!-- Left Foundation Pillar: LUẬT VIỆT NAM (x = 10, width = 210) -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="#dcfce7" stroke="#293140" stroke-width="2.5" filter="url(#anchor-soft)"/>
      <circle cx="28" cy="26" r="16" fill="#86efac" stroke="#293140" stroke-width="1.5"/>
      <text x="28" y="32" font-size="18" text-anchor="middle">⚖️</text>
      <text x="122" y="22" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#166534" text-anchor="middle">BỘ LUẬT LAO ĐỘNG 2019</text>
      <text x="122" y="38" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#15803d" text-anchor="middle">Căn cứ pháp lý chuẩn Việt Nam</text>
    </g>

    <!-- Right Foundation Pillar: HỒ SƠ CÔNG TY (x = 372, width = 210) -->
    <g transform="translate(372, 0)">
      <rect x="0" y="0" width="210" height="52" rx="10" fill="#fef3c7" stroke="#293140" stroke-width="2.5" filter="url(#anchor-soft)"/>
      <circle cx="28" cy="26" r="16" fill="#fde047" stroke="#293140" stroke-width="1.5"/>
      <text x="28" y="32" font-size="18" text-anchor="middle">📁</text>
      <text x="122" y="22" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#92400e" text-anchor="middle">HỒ SƠ &amp; BIỂU MẪU CÔNG TY</text>
      <text x="122" y="38" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#b45309" text-anchor="middle">Quy chế nội bộ &amp; Dữ liệu gốc</text>
    </g>
  </g>

  <!-- CENTER GIANT GOLDEN ANCHOR (x = 320, perfectly in between the two pillars!) -->
  <g transform="translate(320, 168)">
    <!-- Anchor Ring Top -->
    <circle cx="0" cy="5" r="12" fill="none" stroke="#293140" stroke-width="4.5"/>
    <circle cx="0" cy="5" r="12" fill="none" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Crossbar -->
    <line x1="-32" y1="18" x2="32" y2="18" stroke="#293140" stroke-width="7" stroke-linecap="round"/>
    <line x1="-32" y1="18" x2="32" y2="18" stroke="#fde047" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Vertical Shank -->
    <line x1="0" y1="12" x2="0" y2="68" stroke="#293140" stroke-width="9"/>
    <line x1="0" y1="12" x2="0" y2="68" stroke="#f59e0b" stroke-width="6"/>
    
    <!-- Curved Flukes / Arms hooked into ground -->
    <path d="M-40 44 C-40 82 0 88 0 88 C0 88 40 82 40 44" fill="none" stroke="#293140" stroke-width="9" stroke-linecap="round"/>
    <path d="M-40 44 C-40 82 0 88 0 88 C0 88 40 82 40 44" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Triangular fluke points -->
    <polygon points="-40,42 -49,56 -31,54" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <polygon points="40,42 49,56 31,54" fill="#f59e0b" stroke="#293140" stroke-width="2"/>

    <!-- Center Golden Anchor Badge -->
    <rect x="-56" y="90" width="112" height="24" rx="7" fill="#f59e0b" stroke="#293140" stroke-width="2" filter="url(#anchor-soft)"/>
    <text x="0" y="106" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">MỎ NEO VÀNG ⚓</text>
  </g>
</svg>