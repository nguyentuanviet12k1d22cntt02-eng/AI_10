<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <filter id="neo-shadow-2" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#293140" flood-opacity="1"/>
    </filter>
    <filter id="soft-shadow-2" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#293140" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="10" y="10" width="520" height="300" rx="18" fill="#f0f9ff" stroke="#293140" stroke-width="3" filter="url(#neo-shadow-2)"/>

  <!-- TOP AREA: Cloud of Hallucination -->
  <g transform="translate(30, 25)">
    <!-- Fluffy storm/haze cloud -->
    <path d="M40 50 C20 50 10 35 25 20 C20 5 45 -5 60 10 C75 -10 105 -5 115 15 C135 10 150 25 140 45 C155 60 135 80 115 75 C100 85 70 85 55 70 C40 80 25 65 40 50 Z" 
          fill="#fee2e2" stroke="#293140" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="80" y="38" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#dc2626" text-anchor="middle">☁️ MÂY ẢO GIÁC</text>
    <text x="80" y="52" font-family="'Nunito', sans-serif" font-weight="700" font-size="9" fill="#991b1b" text-anchor="middle">(Bịa số liệu, tự chế luật)</text>
  </g>

  <!-- CENTER: Robot Being Held by Heavy Anchor Chain -->
  <g transform="translate(195, 30)">
    <!-- Balloon Basket Strings / Safety Cable -->
    <line x1="75" y1="130" x2="75" y2="190" stroke="#293140" stroke-width="4"/>
    <!-- Heavy Chain links -->
    <circle cx="75" cy="140" r="7" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <circle cx="75" cy="155" r="7" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <circle cx="75" cy="170" r="7" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <circle cx="75" cy="185" r="7" fill="none" stroke="#f59e0b" stroke-width="3.5"/>

    <!-- Cute Balloon Robot Body -->
    <!-- Antenna -->
    <line x1="75" y1="20" x2="75" y2="5" stroke="#293140" stroke-width="3"/>
    <circle cx="75" cy="5" r="6" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <!-- Head Box / Balloon -->
    <rect x="25" y="20" width="100" height="90" rx="24" fill="#38bdf8" stroke="#293140" stroke-width="3.5" filter="url(#neo-shadow-2)"/>
    <!-- Ears -->
    <rect x="15" y="50" width="10" height="25" rx="4" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <rect x="125" y="50" width="10" height="25" rx="4" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
    <!-- Screen Face -->
    <rect x="36" y="30" width="78" height="68" rx="14" fill="#1e293b"/>
    <!-- Relieved & Happy Robot Eyes -->
    <ellipse cx="56" cy="56" rx="9" ry="11" fill="#00f2fe"/>
    <circle cx="53" cy="51" r="3.5" fill="#ffffff"/>
    <ellipse cx="94" cy="56" rx="9" ry="11" fill="#00f2fe"/>
    <circle cx="91" cy="51" r="3.5" fill="#ffffff"/>
    <!-- Cute Robot Smile -->
    <path d="M64 74 Q75 84 86 74" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Cheeks blushing -->
    <circle cx="48" cy="74" r="5" fill="#fb7185" opacity="0.8"/>
    <circle cx="102" cy="74" r="5" fill="#fb7185" opacity="0.8"/>

    <!-- Robot Speech Bubble -->
    <g transform="translate(115, 10)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#ffffff" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-2)"/>
      <polygon points="0,25 -10,20 0,15" fill="#ffffff" stroke="#293140" stroke-width="2"/>
      <line x1="1" y1="16" x2="1" y2="24" stroke="#ffffff" stroke-width="3"/>
      <text x="80" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="11" fill="#1e40af" text-anchor="middle">May quá có Mỏ Neo!</text>
      <text x="80" y="33" font-family="'Nunito', sans-serif" font-weight="700" font-size="10" fill="#15803d" text-anchor="middle">Không sợ bay lạc vào ảo giác!</text>
    </g>

    <!-- GIANT GOLDEN ANCHOR -->
    <g transform="translate(75, 195)">
      <!-- Anchor Ring Top -->
      <circle cx="0" cy="5" r="10" fill="none" stroke="#293140" stroke-width="4"/>
      <circle cx="0" cy="5" r="10" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <!-- Crossbar -->
      <line x1="-28" y1="16" x2="28" y2="16" stroke="#293140" stroke-width="6" stroke-linecap="round"/>
      <line x1="-28" y1="16" x2="28" y2="16" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
      <!-- Vertical Shank -->
      <line x1="0" y1="10" x2="0" y2="55" stroke="#293140" stroke-width="8"/>
      <line x1="0" y1="10" x2="0" y2="55" stroke="#f59e0b" stroke-width="5"/>
      <!-- Curved Arms / Flukes -->
      <path d="M-36 38 C-36 68 0 74 0 74 C0 74 36 68 36 38" fill="none" stroke="#293140" stroke-width="8" stroke-linecap="round"/>
      <path d="M-36 38 C-36 68 0 74 0 74 C0 74 36 68 36 38" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <!-- Arrows on flukes -->
      <polygon points="-36,36 -44,48 -28,46" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
      <polygon points="36,36 44,48 28,46" fill="#f59e0b" stroke="#293140" stroke-width="2"/>
      
      <!-- Label on Anchor -->
      <rect x="-48" y="76" width="96" height="22" rx="6" fill="#f59e0b" stroke="#293140" stroke-width="2" filter="url(#soft-shadow-2)"/>
      <text x="0" y="91" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">MỎ NEO VÀNG</text>
    </g>
  </g>

  <!-- BOTTOM BEDROCK: Ground of Truth -->
  <g transform="translate(25, 230)">
    <!-- Solid Ground Base -->
    <rect x="0" y="35" width="490" height="42" rx="10" fill="#e2e8f0" stroke="#293140" stroke-width="3"/>
    
    <!-- 3 Bedrock Pillars (Reference Documents) -->
    <!-- Pillar 1 -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="140" height="42" rx="8" fill="#dcfce7" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-2)"/>
      <text x="16" y="24" font-size="16">⚖️</text>
      <text x="75" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#166534" text-anchor="middle">LUẬT VIỆT NAM</text>
      <text x="75" y="32" font-family="'Nunito', sans-serif" font-weight="700" font-size="9" fill="#15803d" text-anchor="middle">BLLĐ 2019 / Luật SHTT</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="140" height="42" rx="8" fill="#fef3c7" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-2)"/>
      <text x="16" y="24" font-size="16">📁</text>
      <text x="75" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#92400e" text-anchor="middle">HỒ SƠ CÔNG TY</text>
      <text x="75" y="32" font-family="'Nunito', sans-serif" font-weight="700" font-size="9" fill="#b45309" text-anchor="middle">Biểu mẫu ISO / Quy chế</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(335, 0)">
      <rect x="0" y="0" width="140" height="42" rx="8" fill="#dbeafe" stroke="#293140" stroke-width="2.5" filter="url(#soft-shadow-2)"/>
      <text x="16" y="24" font-size="16">📊</text>
      <text x="75" y="18" font-family="'Nunito', sans-serif" font-weight="900" font-size="10" fill="#1e40af" text-anchor="middle">SỐ LIỆU ĐẦU VÀO</text>
      <text x="75" y="32" font-family="'Nunito', sans-serif" font-weight="700" font-size="9" fill="#2563eb" text-anchor="middle">File Excel / Báo cáo thô</text>
    </g>
  </g>
</svg>